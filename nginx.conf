# Atelier v25k at the domain root. Existing preview paths are unchanged.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the chosen AI Marketing Team homepage at /
    # Assets in that page are relative (img/, fonts/, apply/, favicons),
    # and those names are free at the repo root, so map them here.
    # Do not alias location = / to a file: nginx then looks for
    # ".../index.htmlindex.html" and returns 500.
    location = / {
        rewrite ^ /index.html last;
    }
    location = /index.html {
        alias /usr/share/nginx/html/ai-marketing-team/v25k/index.html;
        default_type text/html;
    }
    location = /favicon.svg {
        alias /usr/share/nginx/html/ai-marketing-team/v25k/favicon.svg;
    }
    location = /favicon.png {
        alias /usr/share/nginx/html/ai-marketing-team/v25k/favicon.png;
    }
    location = /apple-touch-icon.png {
        alias /usr/share/nginx/html/ai-marketing-team/v25k/apple-touch-icon.png;
    }
    location /img/ {
        alias /usr/share/nginx/html/ai-marketing-team/v25k/img/;
    }
    location /fonts/ {
        alias /usr/share/nginx/html/ai-marketing-team/v25k/fonts/;
    }
    location = /apply {
        return 301 /apply/;
    }
    location /apply/ {
        alias /usr/share/nginx/html/ai-marketing-team/v25k/apply/;
    }

    # Giada: only option 11 is live; old concepts redirect to it (BB-335)
    location = /giada { return 301 /giada/option-11/; }
    location = /giada/ { return 301 /giada/option-11/; }
    location = /giada/index.html { return 301 /giada/option-11/; }
    location ~ ^/giada/option-([1-9]|10)(/.*)?$ { return 301 /giada/option-11/; }
    location = /giada/option-11 { return 301 /giada/option-11/; }

    location / {
        try_files $uri $uri/ =404;
    }
}

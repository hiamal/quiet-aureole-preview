# Atelier v25k at the domain root. Existing preview paths are unchanged.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the chosen AI Marketing Team homepage at /
    # Assets in that page are relative (img/, fonts/, apply/, favicons),
    # and those names are free at the repo root, so map them here.
    # Do not alias location = / to a file: nginx then looks for
    # ".../index.htmlindex.html" and returns 500.
    location = / {
        rewrite ^ /index.html last;
    }
    location = /index.html {
        alias /usr/share/nginx/html/ai-marketing-team/v25k/index.html;
        default_type text/html;
    }
    location = /favicon.svg {
        alias /usr/share/nginx/html/ai-marketing-team/v25k/favicon.svg;
    }
    location = /favicon.png {
        alias /usr/share/nginx/html/ai-marketing-team/v25k/favicon.png;
    }
    location = /apple-touch-icon.png {
        alias /usr/share/nginx/html/ai-marketing-team/v25k/apple-touch-icon.png;
    }
    location /img/ {
        alias /usr/share/nginx/html/ai-marketing-team/v25k/img/;
    }
    location /fonts/ {
        alias /usr/share/nginx/html/ai-marketing-team/v25k/fonts/;
    }
    location = /apply {
        return 301 /apply/;
    }
    location /apply/ {
        alias /usr/share/nginx/html/ai-marketing-team/v25k/apply/;
    }
    location = /challenge { absolute_redirect off; return 301 /challenge/; }
    location /challenge/ { alias /usr/share/nginx/html/ai-marketing-team/v25k/challenge/; }
    location = /dfy-complete { absolute_redirect off; return 301 /dfy-complete/; }
    location /dfy-complete/ { alias /usr/share/nginx/html/ai-marketing-team/v25k/dfy-complete/; }
    location = /dfy-social { absolute_redirect off; return 301 /dfy-social/; }
    location /dfy-social/ { alias /usr/share/nginx/html/ai-marketing-team/v25k/dfy-social/; }

    # Giada: option 11 is the final site; options 1–10 and the old /giada/ index redirect to it (BB-335, BB-335b)
    location = /giada { absolute_redirect off; return 301 /giada/option-11/; }
    location = /giada/ { absolute_redirect off; return 301 /giada/option-11/; }
    location = /giada/index.html { absolute_redirect off; return 301 /giada/option-11/; }
    location ~ ^/giada/option-([1-9]|10)(/.*)?$ { absolute_redirect off; return 301 /giada/option-11/; }
    location = /giada/option-11 { absolute_redirect off; return 301 /giada/option-11/; }

    location / {
        try_files $uri $uri/ =404;
    }
}
